<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>العروض | شركة المستقبل الأقوى</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .page-header { text-align: center; padding: 30px 0 20px; }
    .page-header h1 { color: var(--primary); font-size: 1.8rem; }
    .page-header p { color: var(--text-muted); margin-top: 5px; }
    .offers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding-bottom: 80px; }
    
    .offer-card-client {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #f0f0f0;
    }
    .offer-image { width: 100%; height: 200px; object-fit: contain; background: #f9fafb; padding: 10px; }
    .offer-body { padding: 15px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .offer-title { font-size: 1.1rem; font-weight: 800; color: var(--primary); }
    .offer-details { font-size: 0.9rem; color: var(--text-muted); }
    .offer-price-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; border-top: 1px solid #eee; padding-top: 10px; }
    .offer-old-price { text-decoration: line-through; color: #999; font-size: 0.85rem; }
    .offer-new-price { color: #10b981; font-size: 1.4rem; font-weight: 800; }
    .offer-badge { background: #10b981; color: #fff; padding: 2px 8px; border-radius: 999px; font-size: 0.7rem; font-weight: 700; width: fit-content; }
    .btn-add-offer { background: var(--primary); color: #fff; padding: 10px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; transition: all 0.2s; }
    .btn-add-offer:hover { background: var(--primary-dark); }
  </style>
</head>

        <!-- فيسبوك -->

  <script>
    const CART_KEY = 'tsf_cart';
    function loadCart() { return JSON.parse(localStorage.getItem(CART_KEY) || '[]'); }
    function saveCart(cart) { localStorage.setItem(CART_KEY, JSON.stringify(cart)); updateCartBadge(); }
    function updateCartBadge() {
      const total = loadCart().reduce((s, i) => s + i.quantity, 0);
      document.getElementById('cartBadge').textContent = total;
      document.getElementById('cartBadge').style.display = total > 0 ? 'inline-flex' : 'none';
    }
    function addToCart(product, quantity) {
      const cart = loadCart();
      const productId = Number(product.id);
      const existing = cart.find(i => Number(i.id) === productId);
      if (existing) { existing.quantity = Math.min(existing.quantity + quantity, product.stock); }
      else { cart.push({ id: productId, name: product.name, price: Number(product.price), stock: Number(product.stock), quantity }); }
      saveCart(cart);
      alert(`✅ تمت إضافة ${quantity} × ${product.name} للسلة`);
    }

    // جلب العروض
    async function loadOffers() {
      try {
        const res = await fetch('/api/offers');
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);

        const grid = document.getElementById('offersGrid');
        const loading = document.getElementById('loading');
        const empty = document.getElementById('emptyState');
        loading.classList.add('hidden');

        if (data.offers.length === 0) {
          empty.classList.remove('hidden');
          return;
        }

        data.offers.forEach(o => {
          const card = document.createElement('div');
          card.className = 'offer-card-client';
          card.innerHTML = `
            <img src="/images/products/${o.product_id}.png" class="offer-image" onerror="this.src='/images/logo.png'">
            <div class="offer-body">
              <span class="offer-badge">🔥 عرض خاص</span>
              <div class="offer-title">${o.title}</div>
              <div class="offer-details">الكمية: ${o.quantity} قطعة</div>
              <div class="offer-price-row">
                <div>
                  <div class="offer-old-price">$${Number(o.original_price * o.quantity).toFixed(2)}</div>
                  <div class="offer-new-price">$${Number(o.offer_price).toFixed(2)}</div>
                </div>
                <div style="font-size:0.8rem; color:#10b981; font-weight:700;">وفّر ${((1 - (o.offer_price / (o.original_price * o.quantity))) * 100).toFixed(0)}%</div>
              </div>
              <div style="display: flex; gap: 6px; margin-top: 10px;">
                <button class="btn-add-offer" style="flex: 1; margin-top: 0;" onclick="addToCart({id: ${o.product_id}, name: '${o.product_name}', price: ${o.offer_price / o.quantity}, stock: ${o.product_stock}}, ${o.quantity})">🛒 أضف العرض للسلة</button>
                <button class="btn-share-offer" style="width: 44px; background: #f1f5f9; color: #0040C0; border: none; border-radius: 8px; cursor: pointer; font-size: 1.2rem;" onclick="shareOffer(${o.id}, '${o.title}', ${o.offer_price})">🔗</button>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });

      } catch (err) {
        document.getElementById('loading').textContent = '❌ خطأ: ' + err.message;
      }
    }

    updateCartBadge();
    loadOffers();

    // ============================================================
    // مشاركة العرض
    // ============================================================
    let currentOffer = null;

    function shareOffer(offerId, title, price) {
      currentOffer = { id: offerId, title, price };
      const url = `${location.origin}/offers.html#offer-${offerId}`;
      const text = `شاهد العرض: ${title} بسعر $${price} على متجر الصين`;

      document.getElementById('shareOfferWa').href = `https://wa.me/?text=${encodeURIComponent(text + ' ' + url)}`;
      document.getElementById('shareOfferFb').href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;
      document.getElementById('shareOfferTg').href = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;

      document.getElementById('shareOfferCopy').onclick = async () => {
        try {
          await navigator.clipboard.writeText(url);
          alert('📋 تم نسخ رابط العرض');
          document.getElementById('shareOfferModal').classList.add('hidden');
        } catch (e) { alert('❌ فشل النسخ'); }
      };

      // إغلاق القائمة عند الضغط على أي زر
      const closeMenu = () => document.getElementById('shareOfferModal').classList.add('hidden');
      document.getElementById('shareOfferWa').addEventListener('click', closeMenu);
      document.getElementById('shareOfferFb').addEventListener('click', closeMenu);
      document.getElementById('shareOfferTg').addEventListener('click', closeMenu);

      document.getElementById('shareOfferModal').classList.remove('hidden');
    }

    // إغلاق النافذة
    document.getElementById('closeShareOfferModal').onclick = () => {
      document.getElementById('shareOfferModal').classList.add('hidden');
    };
    document.getElementById('shareOfferModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('shareOfferModal')) {
        document.getElementById('shareOfferModal').classList.add('hidden');
      }
    });
  </script>

          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          فيسبوك
        </a>
        <a href="#" id="shareOfferTg" target="_blank" class="btn-primary" style="background: #0088cc; color: #fff; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
          تيليجرام
        </a>
        <button id="shareOfferCopy" class="btn-outline" style="padding: 12px; border-radius: 8px; font-weight: 700; width: 100%;">
          📋 نسخ الرابط
        </button>
      </div>
    </div>
  </div>
