<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الفاتورة | شركة المستقبل الأقوى</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .invoice-page { padding: 30px 0 60px; max-width: 900px; margin: 0 auto; }
    .invoice-box {
      background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 30px; margin-bottom: 20px;
    }
    .invoice-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 20px; }
    .invoice-header img { width: 80px; height: 80px; }
    .invoice-title { color: var(--primary); font-size: 1.5rem; font-weight: 800; }
    .invoice-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
    .invoice-meta div { font-size: 0.9rem; }
    .invoice-meta strong { color: var(--primary); }
    
    .invoice-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    .invoice-table th { text-align: right; background: #f8fafc; padding: 12px; font-size: 0.85rem; color: var(--text-muted); border-bottom: 1px solid #eee; }
    .invoice-table td { padding: 12px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    .invoice-table .item-name { font-weight: 700; }
    .invoice-table .item-total { font-weight: 700; color: var(--primary); }
    
    .invoice-total { text-align: left; margin-top: 20px; padding-top: 20px; border-top: 2px solid #eee; }
    .invoice-total .total-row { display: flex; justify-content: flex-end; gap: 40px; font-size: 1.1rem; font-weight: 700; }
    .invoice-total .total-row span:first-child { color: var(--text-muted); }
    .invoice-total .total-row span:last-child { color: var(--primary); font-size: 1.3rem; }

    .invoice-actions { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
    .btn-edit { background: #eff6ff; color: #0040C0; padding: 12px 24px; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .btn-confirm { background: #10b981; color: #fff; padding: 12px 24px; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .btn-print { background: var(--primary); color: #fff; padding: 12px 24px; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .btn-back { background: #f1f5f9; color: #475569; padding: 12px 24px; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    
    .status-badge { padding: 6px 16px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-confirmed { background: #dbeafe; color: #1e40af; }
    .status-approved { background: #d1fae5; color: #065f46; }
    
    /* تحسينات الطباعة */
    @media print {
      .site-header, .bottom-nav, .floating-whatsapp, .invoice-actions, .btn-back, .btn-edit, .btn-confirm, .no-print { display: none !important; }
      body { background: #fff !important; padding: 0 !important; }
      .invoice-box { box-shadow: none !important; border: 1px solid #ccc !important; margin: 0 !important; }
      .invoice-page { padding: 0 !important; }
    }
  </style>
</head>
<body>

  <header class="site-header no-print">
    <div class="container header-inner">
      <a href="/" class="brand">
        <img src="/images/logo.png" alt="شعار" class="brand-logo">
        <div class="brand-text">
          <span class="ar">شركة المستقبل الأقوى</span>
          <span class="en">متجر الصين</span>
        </div>
      </a>
      <div class="header-actions">
        <a href="/" class="icon-btn" style="background: #fff; color: #0040C0; border: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-weight: 700;">🏠 <span>الرئيسية</span></a>
      </div>
    </div>
  </header>

  <main class="container invoice-page">
    <div id="loading" class="loading">⏳ جاري تحميل الفاتورة...</div>
    <div id="errorMsg" class="empty-state hidden">
      <div class="emoji">❌</div>
      <p>عذراً، لم يتم العثور على هذه الفاتورة.</p>
      <a href="/" class="btn-primary" style="display:inline-block; margin-top:15px;">العودة للمتجر</a>
    </div>

    <div id="invoiceContainer" class="hidden">
      <div class="invoice-box">
        <!-- Header -->
        <div class="invoice-header">
          <div>
            <div class="invoice-title">فاتورة ضريبية</div>
            <div style="color:var(--text-muted); font-size:0.85rem; margin-top:5px;">رقم: <strong id="invId" style="color:var(--primary);">#0</strong></div>
          </div>
          <img src="/images/logo.png" alt="شعار">
        </div>

        <!-- Meta -->
        <div class="invoice-meta">
          <div><strong>التاريخ:</strong> <span id="invDate"></span></div>
          <div><strong>العميل:</strong> <span id="invName"></span></div>
          <div><strong>الهاتف:</strong> <span id="invPhone"></span></div>
          <div><strong>العنوان:</strong> <span id="invAddress"></span></div>
          <div><strong>الحالة:</strong> <span id="invStatus" class="status-badge"></span></div>
        </div>

        <!-- Items Table -->
        <table class="invoice-table">
          <thead>
            <tr>
              <th>المنتج</th>
              <th>الكمية</th>
              <th>سعر الوحدة</th>
              <th>الإجمالي</th>
            </tr>
          </thead>
          <tbody id="invItems"></tbody>
        </table>

        <!-- Total -->
        <div class="invoice-total">
          <div class="total-row">
            <span>المجموع الكلي:</span>
            <span id="invTotal">$0.00</span>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="invoice-actions no-print" id="invoiceActions">
        <!-- سيتم عرض الأزرار المناسبة حسب الحالة -->
      </div>
    </div>
  </main>

  <script>
    const CART_KEY = 'tsf_cart';
    let currentOrder = null;
    let adminPassword = sessionStorage.getItem('admin_pass') || '';

    const $ = (s) => document.querySelector(s);

    // جلب رقم الفاتورة من الرابط
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('id');

    async function loadInvoice() {
      if (!orderId) return showError();
      try {
        const res = await fetch(`/api/orders?id=${orderId}`);
        const data = await res.json();
        if (!data.ok || !data.order) return showError();
        
        currentOrder = data.order;
        renderInvoice();
      } catch (e) {
        showError();
      }
    }

    function renderInvoice() {
      const o = currentOrder;
      $('#loading').classList.add('hidden');
      $('#invoiceContainer').classList.remove('hidden');

      // تعبئة البيانات
      $('#invId').textContent = `#${o.id}`;
      $('#invDate').textContent = new Date(o.created_at).toLocaleString('ar-EG');
      $('#invName').textContent = o.customer_name;
      $('#invPhone').textContent = o.customer_phone;
      $('#invAddress').textContent = o.customer_address || '—';

      // الحالة
      const statusEl = $('#invStatus');
      if (o.status === 'pending' && o.is_confirmed == 0) {
        statusEl.textContent = 'قيد التعديل';
        statusEl.className = 'status-badge status-pending';
      } else if (o.status === 'pending' && o.is_confirmed == 1) {
        statusEl.textContent = 'بانتظار الموافقة';
        statusEl.className = 'status-badge status-confirmed';
      } else if (o.status === 'approved') {
        statusEl.textContent = 'تمت الموافقة ✅';
        statusEl.className = 'status-badge status-approved';
      } else if (o.status === 'rejected') {
        statusEl.textContent = 'مرفوضة ❌';
        statusEl.className = 'status-badge';
        statusEl.style.background = '#fee2e2';
        statusEl.style.color = '#991b1b';
      }

      // المنتجات
      const itemsBody = $('#invItems');
      itemsBody.innerHTML = '';
      let total = 0;
      (o.items || []).forEach(item => {
        const itemTotal = item.quantity * item.price;
        total += itemTotal;
        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="item-name">${item.name || 'منتج'}</td>
          <td>${item.quantity}</td>
          <td>$${Number(item.price).toFixed(2)}</td>
          <td class="item-total">$${itemTotal.toFixed(2)}</td>
        `;
        itemsBody.appendChild(row);
      });

      $('#invTotal').textContent = `$${total.toFixed(2)}`;

      // الأزرار
      renderActions(o);
    }

    function renderActions(o) {
      const actions = $('#invoiceActions');
      actions.innerHTML = '';

      // إذا كان الطلب قيد التعديل (pending + is_confirmed=0)
      if (o.status === 'pending' && o.is_confirmed == 0) {
        actions.innerHTML = `
          <button class="btn-edit" onclick="editOrder()">✏️ تعديل الطلب</button>
          <button class="btn-update" onclick="sendWhatsAppUpdate()" style="background: #25D366; color: #fff; padding: 12px 24px; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px;">📤 إرسال تحديث للمدير</button>
          <button class="btn-confirm" onclick="confirmOrder()">✅ تأكيد الطلب النهائي</button>
          <a href="/" class="btn-back">⬅️ العودة للمتجر</a>
        `;
      } 
      // إذا كان بانتظار الموافقة (pending + is_confirmed=1)
      else if (o.status === 'pending' && o.is_confirmed == 1) {
        actions.innerHTML = `
          <div style="color: var(--text-muted); text-align: center; width: 100%; padding: 10px;">
            ⏳ طلبك قيد المراجعة من الإدارة. لا يمكن التعديل عليه الآن.
          </div>
          <a href="/" class="btn-back">⬅️ العودة للمتجر</a>
        `;
      } 
      // إذا تمت الموافقة (approved)
      else if (o.status === 'approved') {
        actions.innerHTML = `
          <button class="btn-print" onclick="window.print()">🖨️ طباعة الفاتورة / حفظ PDF</button>
          <a href="/" class="btn-back">⬅️ العودة للمتجر</a>
        `;
      }
      // إذا كان مرفوضاً
      else if (o.status === 'rejected') {
        actions.innerHTML = `
          <div style="color: var(--danger); text-align: center; width: 100%; padding: 10px;">
            ❌ تم رفض هذا الطلب من قبل الإدارة.
          </div>
          <a href="/" class="btn-back">⬅️ العودة للمتجر</a>
        `;
      }
    }

    // تعديل الطلب (إضافة منتجات / تغيير كميات)
    function editOrder() {
      // تحويل المستخدم إلى صفحة السلة مع رقم الطلب للتعديل
      window.location.href = `/cart.html?edit_order=${orderId}`;
    }

    // إرسال تحديث للمدير عبر واتساب
    function sendWhatsAppUpdate() {
      if (!currentOrder) return;
      const managerPhone = '963956410417';
      const invoiceUrl = `${location.origin}/invoice.html?id=${orderId}`;
      
      let waMessage = `🔄 *تحديث على الطلب #${currentOrder.id}* 🔄\n`;
      waMessage += `------------------------\n`;
      waMessage += `👤 *الاسم:* ${currentOrder.customer_name}\n`;
      waMessage += `📞 *الهاتف:* ${currentOrder.customer_phone}\n`;
      waMessage += `📦 *المنتجات المحدثة:*\n`;
      (currentOrder.items || []).forEach(item => {
        waMessage += `▪️ ${item.name} (الكمية: ${item.quantity}) = $${(item.quantity * item.price).toFixed(2)}\n`;
      });
      waMessage += `------------------------\n`;
      waMessage += `💰 *الإجمالي:* $${currentOrder.total.toFixed(2)}\n`;
      waMessage += `🔗 *رابط الفاتورة:* ${invoiceUrl}\n`;
      waMessage += `⚠️ *يرجى مراجعة الطلب.*`;
      
      const waUrl = `https://wa.me/${managerPhone}?text=${encodeURIComponent(waMessage)}`;
      window.open(waUrl, '_blank');
    }

    // تأكيد الطلب النهائي
    async function confirmOrder() {
      if (!confirm('هل أنت متأكد من تأكيد الطلب؟ بعد التأكيد لن تتمكن من تعديله.')) return;

      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'confirm', order_id: orderId })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        
        // --- إرسال رسالة تأكيد نهائي للمدير ---
        const managerPhone = '963956410417';
        const invoiceUrl = `${location.origin}/invoice.html?id=${orderId}`;
        let waMessage = `✅ *تم تأكيد الطلب نهائياً* ✅\n`;
        waMessage += `------------------------\n`;
        waMessage += `📝 *رقم الطلب:* #${orderId}\n`;
        waMessage += `👤 *العميل:* ${currentOrder.customer_name}\n`;
        waMessage += `🔗 *رابط الفاتورة:* ${invoiceUrl}`;
        
        const waUrl = `https://wa.me/${managerPhone}?text=${encodeURIComponent(waMessage)}`;
        window.open(waUrl, '_blank');
        
        alert('✅ تم تأكيد طلبك، وهو الآن بانتظار موافقة الإدارة.');
        window.location.reload();
      } catch (e) {
        alert('❌ ' + e.message);
      }
    }

    function showError() {
      $('#loading').classList.add('hidden');
      $('#errorMsg').classList.remove('hidden');
    }

    loadInvoice();
  </script>
</body>
</html>
